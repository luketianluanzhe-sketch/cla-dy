; AI / TikTok 分流 · subconverter-ng 单文件外部配置
; 使用 target=clash（Clash.Meta / Mihomo）。将本文件的 HTTP/HTTPS 原始文件 URL 填入 config。
; 无远程规则列表、无 rules/ 目录依赖。
; 来源：本机 Clash Verge 当前配置。AI 51 条（去除 3 条重复项），TikTok 33 条。
; 基础局域网及路由器直连 37 条；最后为国内直连与默认出口。
; no-resolve 使用等价的单条件 AND，避免转换器把标记与策略组顺序写反。
; 兼容性已验证：subconverter-ng v0.8.0 / Mihomo v1.19.32。
[custom]
enable_rule_generator=true
overwrite_original_rules=true
add_emoji=false
remove_old_emoji=false

; 策略组：AI 与 TikTok 均列出全部订阅节点，可分别选择出口。
; .* 匹配全部节点，更换订阅或节点名称后无需修改筛选条件。
custom_proxy_group=🚀 节点选择`select`.*
custom_proxy_group=♻️ AI`select`.*
custom_proxy_group=🎵 TikTok`select`.*
custom_proxy_group=🎯 国内直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`.*`[]🎯 国内直连

